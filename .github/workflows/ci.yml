name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  native-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify real fixture integrity (offline)
        run: python3 packages/cliproxy-observability/native/harness/check_fixtures.py packages/cliproxy-observability/fixtures/real
      - name: Build and test native capture
        run: docker build -t cliproxy-capture-proof -f packages/cliproxy-observability/native/harness/Dockerfile packages/cliproxy-observability/native
      - name: Exercise official stock binary and isolated gateway
        run: docker run --rm --cpus 2 --memory 4g cliproxy-capture-proof
